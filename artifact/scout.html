<title>Brendobendo Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single scouting column; a sticky header carries the four tools, cards stack below at phone width */
:root {
  --bg: #f3f6f2; --surface: #ffffff; --surface-2: #e9efe8; --line: #d8e0d6;
  --ink: #132019; --ink-2: #4a5a50; --muted: #76857b;
  --turf: #1b7a4c; --turf-ink: #ffffff; --turf-soft: #dcefe3; --chalk: #fbfcfa;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #c98500;
  --good: #0f7d34; --good-bg: #dff3e5; --warn: #8a5a00; --warn-bg: #fbefd2; --bad: #b02a2a; --bad-bg: #fbe3e3;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1310; --surface: #141c17; --surface-2: #1c2620; --line: #26322b;
  --ink: #edf3ee; --ink-2: #a9b8ae; --muted: #7d8c82;
  --turf: #3fae78; --turf-ink: #06140c; --turf-soft: #183a28; --chalk: #141c17;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #6fd38e; --good-bg: #173322; --warn: #f2b84b; --warn-bg: #362a12; --bad: #ff8f8f; --bad-bg: #3d1c1c;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1310; --surface: #141c17; --surface-2: #1c2620; --line: #26322b;
  --ink: #edf3ee; --ink-2: #a9b8ae; --muted: #7d8c82;
  --turf: #3fae78; --turf-ink: #06140c; --turf-soft: #183a28; --chalk: #141c17;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #6fd38e; --good-bg: #173322; --warn: #f2b84b; --warn-bg: #362a12; --bad: #ff8f8f; --bad-bg: #3d1c1c;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
a { color: var(--turf); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.brand h1 span { color: var(--turf); }
.fresh { font-size: 12.5px; color: var(--ink-2); }
nav.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
nav.tabs a { padding: 8px 14px 10px; text-decoration: none; color: var(--ink-2); font-family: var(--display);
  font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--turf); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stack { display: grid; gap: 14px; margin-top: 16px; }
.stack > *, .card { min-width: 0; }   /* let wide tables scroll inside their card, not widen the page */
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px;
  font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.turf { background: var(--turf-soft); color: var(--turf); }
.grade { font-family: var(--display); font-weight: 800; font-size: 14px; border-radius: 5px; padding: 0 6px; }
.grade.A, .grade.B { background: var(--good-bg); color: var(--good); } .grade.C { background: var(--surface-2); color: var(--ink-2); }
.grade.D, .grade.F { background: var(--bad-bg); color: var(--bad); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
.btn:disabled { opacity: .55; cursor: default; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px;
  font-weight: 600; cursor: pointer; color: var(--ink-2); }
.pill.on { background: var(--turf-soft); border-color: var(--turf); color: var(--turf); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
.banner { border-radius: 10px; padding: 10px 14px; background: var(--warn-bg); color: var(--warn); }

/* search */
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.18); max-height: 320px; overflow-y: auto; }
.results button { display: flex; justify-content: space-between; width: 100%; gap: 8px; padding: 8px 12px; border: 0;
  background: none; text-align: left; cursor: pointer; }
.results button:hover, .results button.hl { background: var(--surface-2); }

/* player card */
.phead { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.pname { font-size: 34px; font-weight: 800; line-height: 1.05; text-transform: uppercase; }
.pos-team { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink-2); letter-spacing: .04em; }
.projbox { text-align: right; }
.projbox .num { font-family: var(--display); font-size: 48px; font-weight: 800; line-height: 1; color: var(--turf); }
.projbox .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.formula { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.term { background: var(--surface-2); border-radius: 8px; padding: 5px 9px; text-align: center; min-width: 0; }
.term .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.term .v { font-weight: 700; }
.term.up .v { color: var(--good); } .term.down .v { color: var(--bad); }
.op { color: var(--muted); }
.stats3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { border-left: 3px solid var(--turf); padding-left: 10px; }
.stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.stat .v { font-family: var(--display); font-size: 24px; font-weight: 700; }
.model { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--turf-soft); font-size: 14px; }

/* chart + tables */
.chart { position: relative; margin-top: 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.sw.line { height: 3px; border-radius: 2px; vertical-align: 3px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; font-weight: 600;
  padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.num, th.num { text-align: right; }
td.best { color: var(--turf); font-weight: 700; }
.cmp th.pl { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
.cmp th.pl, .cmp td { white-space: normal; min-width: 110px; }
.cmp tbody th { white-space: normal; min-width: 120px; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 15px; }

/* news */
.newsrow { border-bottom: 1px solid var(--line); padding: 10px 0; }
.newsrow:last-child { border-bottom: 0; }
.sbar { display: inline-block; position: relative; width: 70px; height: 6px; background: var(--surface-2); border-radius: 3px; vertical-align: middle; }
.sbar i { position: absolute; top: 0; height: 6px; border-radius: 3px; }
.sbar::after { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: var(--muted); }
.arts { margin: 6px 0 0; padding-left: 18px; }
.arts li { margin: 3px 0; }

/* chat */
.chat { display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--turf); color: var(--turf-ink); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul { margin: 4px 0 8px; padding-left: 18px; }
.msg .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.composer { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: vertical; min-height: 44px; max-height: 160px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* league tabs: summary tiles, checklist, roster/waiver tables, matchup scoreboard */
.banner.info { background: var(--turf-soft); color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { display: block; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--line);
  border-radius: 12px; padding: 10px 14px 12px; color: inherit; text-decoration: none; min-width: 0; }
a.tile:hover { background: var(--surface-2); }
.tile.good { border-top-color: var(--good); } .tile.warn { border-top-color: var(--warn); }
.tile.bad { border-top-color: var(--bad); } .tile.turf { border-top-color: var(--turf); }
.tile .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.tile .v.sm { font-size: 21px; padding-block: 5px 2px; }
.tile .h { font-size: 12.5px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.checklist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 9px; }
.checklist li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.checklist li .chip { justify-content: center; width: 100%; }
.plink { border: 0; background: none; padding: 0; color: var(--turf); font-weight: 600; cursor: pointer; text-align: left; }
.plink:hover { text-decoration: underline; }
.pos { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
td.adj, th.adj { text-align: right; } td.adj { font-weight: 700; color: var(--turf); }
tr.clickable { cursor: pointer; } tr.clickable:hover > td { background: var(--surface-2); }
tr.flag-start > td:first-child { box-shadow: inset 3px 0 var(--good); }
tr.flag-bench > td:first-child { box-shadow: inset 3px 0 var(--warn); }
tr.detail > td { white-space: normal; background: var(--surface-2); padding: 4px 12px 12px; }
tr.detail .formula { margin-top: 6px; }
.why-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.diff.up { color: var(--good); font-weight: 700; } .diff.down { color: var(--bad); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button.on { background: var(--turf-soft); color: var(--turf); }
.chip.live { background: var(--bad-bg); color: var(--bad); }
.scoreboard { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.sb-name { font-family: var(--display); font-weight: 800; font-size: 19px; text-transform: uppercase; line-height: 1.1; overflow-wrap: break-word; }
.sb-pts { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; margin-top: 4px; }
.sb-team.r { text-align: right; }
.sb-mid { text-align: center; min-width: 92px; }
.sb-wp { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--turf); line-height: 1.1; }
.wpbar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.wpbar span { display: block; height: 100%; background: var(--turf); }
.mt { table-layout: fixed; } .mt col.p { width: 58px; } .mt col.s { width: 40px; }
.mt td { white-space: normal; vertical-align: top; overflow-wrap: anywhere; padding-inline: 5px; }
.mt td.slot { text-align: center; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; vertical-align: middle; }
.mt td.pts { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; white-space: nowrap; }
.mt td.pts.l { text-align: right; } .mt td.r { text-align: right; }
.mt td .sub { font-family: var(--body); font-size: 11.5px; font-weight: 400; color: var(--muted); }
details.card > summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 17px; }
.more { margin-top: 10px; text-align: center; }

@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
  .sb-pts { font-size: 36px; } .sb-name { font-size: 14px; } .sb-wp { font-size: 22px; } .sb-mid { min-width: 62px; }
  .scoreboard { gap: 8px; }
  .mt td.pts { font-size: 16px; } .mt col.p { width: 46px; } .mt col.s { width: 38px; } .mt td.slot { font-size: 10.5px; padding-inline: 2px; }
  .mt td .chip { font-size: 10.5px; padding-inline: 6px; }
  .pname { font-size: 28px; } .projbox .num { font-size: 40px; }
  .stats3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .projbox { text-align: left; }
  nav.tabs a { font-size: 15px; padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Brendobendo <span>Scout</span></h1><span class="fresh" id="fresh">Loading player data…</span></div>
    <nav class="tabs" id="tabs">
      <a href="#summary" data-t="summary">Summary</a>
      <a href="#matchup" data-t="matchup">Matchup</a>
      <a href="#roster" data-t="roster">Roster</a>
      <a href="#waivers" data-t="waivers">Waivers</a>
      <a href="#player" data-t="player">Player</a>
      <a href="#compare" data-t="compare">Compare</a>
      <a href="#news" data-t="news">News</a>
      <a href="#ask" data-t="ask">Ask</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"><div class="card empty" style="margin-top:16px">Loading player data…</div></main>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (v) => (v == null || Number.isNaN(v) ? "–" : Number(v).toFixed(1));
const sgn = (v, d = 1) => (v == null ? "–" : (Math.round(v * 10 ** d) > 0 ? "+" : Math.round(v * 10 ** d) < 0 ? "−" : "") + Math.abs(v).toFixed(d));
const store = { get(k, d) { try { const v = localStorage.getItem("scout:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem("scout:" + k, JSON.stringify(v)); } catch { /* storage off */ } } };

let D = null, byId = new Map();
let L = null;   // league.json: what the web app shows (matchup, roster, waivers, runs), exported with each data refresh
const S = { player: store.get("player", null), compare: store.get("compare", null), pos: "ALL", turns: store.get("turns", []), newsMine: true };

// ---- data helpers ----------------------------------------------------------------
const proj = (p) => (p.proj && p.proj.value != null ? p.proj.value : null);
const nextW = () => D.meta.next_week;
const posRank = (p) => (p.proj && p.proj.pos_rank ? `${p.pos}${p.proj.pos_rank}` : "–");
const pts = (p) => p.weeks.map((w) => w.pts).filter((v) => v != null);
const stdev = (a) => { if (a.length < 2) return null; const m = a.reduce((s, v) => s + v, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); };
const perGame = (p, k) => { const g = p.weeks.length; return g ? p.weeks.reduce((s, w) => s + (w[k] || 0), 0) / g : null; };
const usage = (p) => p.pos === "QB" ? [["Pass att/g", perGame(p, "pa")], ["Rush att/g", perGame(p, "car")]]
  : p.pos === "RB" ? [["Carries/g", perGame(p, "car")], ["Targets/g", perGame(p, "tgt")]]
  : p.pos === "K" ? [["FG att/g", perGame(p, "fga")], ["XP/g", perGame(p, "xpm")]]
  : p.pos === "DEF" ? [["Sacks/g", perGame(p, "sk")], ["Takeaways/g", (perGame(p, "int") || 0) + (perGame(p, "fr") || 0)]]
  : [["Targets/g", perGame(p, "tgt")], ["Tgt share", (() => { const t = p.weeks.map((w) => w.tshare).filter((v) => v != null); return t.length ? t.reduce((s, v) => s + v, 0) / t.length : null; })()]];

function findPlayers(q, { pos = null, limit = 10 } = {}) {
  const s = String(q || "").toLowerCase().trim();
  if (!s) return [];
  const out = [];
  for (const p of D.players) {
    if (pos && p.pos !== pos) continue;
    const n = p.name.toLowerCase();
    const hay = `${n} ${p.team} ${p.pos} ${p.aka || (p.pos === "DEF" ? "dst d/st defense" : "")}`.toLowerCase();
    if (!s.split(/\s+/).every((t) => hay.includes(t))) continue;
    const prefix = n.startsWith(s) || n.split(" ").some((w) => w.startsWith(s)) || (p.aka || "").toLowerCase().startsWith(s);
    // a bare team code ("KC") puts that team's D/ST first, then its players
    const rank = p.pos === "DEF" && s === p.team.toLowerCase() ? -1 : prefix ? 0 : 1;
    out.push([rank, -(proj(p) || 0), p]);
  }
  return out.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, limit).map((x) => x[2]);
}
const resolve = (key) => byId.get(String(key)) || findPlayers(key, { limit: 1 })[0] || null;

// ---- shared bits ----------------------------------------------------------------------
function injChip(p) {
  const st = p.injury && p.injury.status;
  if (st) return `<span class="chip ${st === "Questionable" ? "warn" : "bad"}">${esc(st)}${p.injury.detail ? " · " + esc(p.injury.detail) : ""}</span>`;
  const pr = p.injury && p.injury.practice;
  if (pr && /Did Not/.test(pr)) return `<span class="chip warn" title="${esc(pr)}">DNP practice</span>`;
  if (pr && /Limited/.test(pr)) return `<span class="chip warn" title="${esc(pr)}">Limited practice</span>`;
  return "";
}
const grade = (g) => (g ? `<span class="grade ${g}">${g}</span>` : "");
const mine = (p) => (p.mine ? `<span class="chip turf">On your roster</span>` : "");

function searchBox(placeholder, onPick, id) {
  const w = document.createElement("div");
  w.className = "search";
  w.innerHTML = `<input id="${id}" type="search" placeholder="${esc(placeholder)}" autocomplete="off" aria-label="${esc(placeholder)}"><div class="results" hidden></div>`;
  const inp = $("input", w), box = $(".results", w);
  let items = [], hl = 0;
  const paint = () => {
    box.hidden = !items.length;
    box.innerHTML = items.map((p, i) => `<button type="button" data-i="${i}" class="${i === hl ? "hl" : ""}">
      <span><b>${esc(p.name)}</b> <span class="muted small">${esc(p.pos)} · ${esc(p.team)}</span></span>
      <span class="small muted">${proj(p) != null ? `wk ${nextW()} ${f1(proj(p))}` : ""}</span></button>`).join("");
  };
  inp.addEventListener("input", () => { items = findPlayers(inp.value); hl = 0; paint(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { hl = Math.min(hl + 1, items.length - 1); paint(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); paint(); e.preventDefault(); }
    else if (e.key === "Enter" && items[hl]) { onPick(items[hl]); inp.value = ""; items = []; paint(); }
    else if (e.key === "Escape") { items = []; paint(); }
  });
  box.addEventListener("mousedown", (e) => { const b = e.target.closest("button[data-i]"); if (b) { e.preventDefault(); onPick(items[+b.dataset.i]); inp.value = ""; items = []; paint(); } });
  inp.addEventListener("blur", () => setTimeout(() => { items = []; paint(); }, 150));
  return w;
}

// ---- chart -------------------------------------------------------------------------------
function niceMax(v) { const step = v <= 10 ? 2 : v <= 25 ? 5 : 10; return Math.max(step * 2, Math.ceil(v / step) * step); }

function weeklyChart(series, { projection = null } = {}) {
  // series: [{label, color, weeks:[{w, pts, opp}]}]; one series draws bars, several draw lines
  const W = 720, H = 230, L = 34, R = 10, T = 12, B = 28;
  const lastW = Math.max(D.meta.through_week, projection ? projection.week : 0, 1);
  const weeks = Array.from({ length: lastW }, (_, i) => i + 1);
  const vals = series.flatMap((s) => s.weeks.map((w) => w.pts || 0)).concat(projection ? [projection.value || 0] : []);
  const max = niceMax(Math.max(5, ...vals));
  const band = (W - L - R) / weeks.length, x = (w) => L + band * (w - 1) + band / 2, y = (v) => T + (H - T - B) * (1 - Math.max(0, v) / max);
  const ticks = [0, max / 4, max / 2, (3 * max) / 4, max];
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly fantasy points">`;
  ticks.forEach((t) => { svg += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/>
    <text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${+t.toFixed(1)}</text>`; });
  weeks.forEach((w) => { svg += `<text x="${x(w)}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${projection && w === projection.week ? "var(--ink)" : "var(--muted)"}" font-weight="${projection && w === projection.week ? 700 : 400}">W${w}</text>`; });
  const base = y(0), bw = Math.min(30, band * 0.55);
  if (series.length === 1) {
    series[0].weeks.forEach((wk) => {
      if (wk.pts == null) return;
      const top = y(wk.pts), r = Math.min(4, (base - top) / 2), x0 = x(wk.w) - bw / 2, x1 = x(wk.w) + bw / 2;
      if (base - top >= 0.5) svg += `<path fill="${series[0].color}" d="M${x0},${base} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x1 - r} Q${x1},${top} ${x1},${top + r} V${base} Z"/>`;
    });
    if (projection && projection.value) {
      const top = y(projection.value);
      svg += `<rect x="${x(projection.week) - bw / 2}" y="${top}" width="${bw}" height="${Math.max(0, base - top)}" rx="3" fill="none" stroke="var(--turf)" stroke-width="2" stroke-dasharray="5 3"/>`;
    }
  } else {
    series.forEach((s) => {
      const pts_ = s.weeks.filter((w) => w.pts != null).map((w) => [x(w.w), y(w.pts)]);
      let d = "", prevW = null;
      s.weeks.filter((w) => w.pts != null).forEach((w, i) => { d += (i && prevW === w.w - 1 ? "L" : "M") + x(w.w) + "," + y(w.pts); prevW = w.w; });
      svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
      pts_.forEach(([cx, cy]) => { svg += `<circle cx="${cx}" cy="${cy}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
    });
  }
  weeks.forEach((w) => { svg += `<rect class="hit" data-w="${w}" x="${L + band * (w - 1)}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>`; });
  svg += `<line x1="${L}" x2="${W - R}" y1="${base}" y2="${base}" stroke="var(--ink-2)" stroke-opacity=".4"/></svg>`;
  return svg;
}

function bindChart(root, series, projection) {
  const tip = $("#tip");
  root.querySelectorAll(".hit").forEach((r) => {
    const show = (ev) => {
      const w = +r.dataset.w;
      const rows = series.map((s) => { const wk = s.weeks.find((x) => x.w === w);
        return `<div class="row" style="justify-content:space-between;gap:14px"><span><span class="sw" style="background:${s.color}"></span>${esc(s.label)}</span><b>${wk ? f1(wk.pts) + (series.length === 1 ? ` <span class="muted">${esc(wk.opp)}</span>` : "") : "—"}</b></div>`; }).join("");
      const pr = projection && projection.week === w ? `<div class="row" style="justify-content:space-between;gap:14px"><span>Projected ${esc(projection.opp)}</span><b>${f1(projection.value)}</b></div>` : "";
      tip.innerHTML = `<div><b>Week ${w}</b></div>${rows}${pr}`;
      tip.hidden = false;
      const px = ev.touches ? ev.touches[0].clientX : ev.clientX, py = ev.touches ? ev.touches[0].clientY : ev.clientY;
      tip.style.left = Math.min(px + 12, innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = py + 14 + "px";
    };
    r.addEventListener("mousemove", show);
    r.addEventListener("touchstart", show, { passive: true });
    r.addEventListener("mouseleave", () => { tip.hidden = true; });
  });
}

// ---- Player --------------------------------------------------------------------------------
function formula(p) {
  const pr = p.proj;
  if (!pr) return "";
  if (pr.bye) return `<p class="muted">Bye in week ${pr.week}.</p>`;
  if (pr.base == null) return `<p class="muted">No games yet this season, so there's no baseline projection.</p>`;
  const cls = (m) => (m > 1.0005 ? "up" : m < 0.9995 ? "down" : "");
  return `<div class="formula">
    <div class="term"><div class="k">Base</div><div class="v">${f1(pr.base)}</div></div><span class="op">×</span>
    <div class="term ${cls(pr.mult_matchup)}" title="${p.pos === "DEF" ? "Opposing offense vs D/STs and its Vegas implied total" : `Defense vs ${esc(p.pos)} and Vegas implied total`}"><div class="k">Matchup</div><div class="v">${pr.mult_matchup.toFixed(2)}</div></div><span class="op">×</span>
    <div class="term ${cls(pr.mult_injury)}"><div class="k">Injury</div><div class="v">${pr.mult_injury.toFixed(2)}</div></div><span class="op">=</span>
    <div class="term"><div class="k">Wk ${pr.week}</div><div class="v">${f1(pr.value)}</div></div></div>
    <p class="small muted" style="margin:8px 0 0">Base = ${Math.round(D.meta.recent_weight * 100)}% last-${D.meta.recent_weeks} average (${f1(p.recent)}) + ${Math.round((1 - D.meta.recent_weight) * 100)}% season average (${f1(p.avg)}).
      ${p.pos === "DEF"
        ? `${pr.def_rank ? `${esc(pr.opp.replace(/^(vs|@) /, ""))}'s offense has given up ${pr.def_ratio}× the average D/ST points per game (rank ${pr.def_rank} of ${pr.def_teams}, higher is better for you).` : ""}
           ${pr.implied != null ? `Opponent implied total ${f1(pr.implied)} (week average ${f1(D.meta.implied_avg)}); lower is better for a defense.` : ""}`
        : `${pr.def_rank ? `${esc(pr.opp.replace(/^(vs|@) /, ""))} ranks ${pr.def_rank} of ${pr.def_teams} against ${esc(p.pos)}s (${pr.def_ratio}× league-average points allowed).` : ""}
           ${pr.implied != null ? `Team implied total ${f1(pr.implied)} (week average ${f1(D.meta.implied_avg)}).` : ""}`}</p>`;
}

function modelNote(p) {
  const m = p.model;
  if (!m) return "";
  return `<div class="model"><b>Your pipeline (week ${m.week}):</b> ${m.adj != null ? `model ${f1(m.adj)} pts` : ""}${m.sleeper_proj != null ? ` · Sleeper ${f1(m.sleeper_proj)}` : ""}${m.n_articles ? ` · news ${sgn(m.sentiment, 2)} (${m.n_articles} articles)` : ""}${m.weather ? ` · ${esc(m.weather)}` : ""}${m.notes && m.notes.length ? ` · ${esc(m.notes.join(", "))}` : ""}</div>`;
}

    const picks = D.players.filter((x) => x.mine).slice(0, 16);

    : p.pos === "DEF" ? [["sk", "Sacks"], ["int", "INT"], ["fr", "Fum rec"], ["td", "TD"], ["pa", "Pts allowed"]]
    : [["car", "Car"], ["ry", "Rush yd"], ["rtd", "Rush TD"], ["tgt", "Tgt"], ["rec", "Rec"], ["recy", "Rec yd"], ["rectd", "Rec TD"]];
  body.innerHTML = `<div class="card">
      <div class="phead"><div><div class="pname">${esc(p.name)}</div>
        <div class="row" style="margin-top:4px"><span class="pos-team">${esc(p.pos)} · ${esc(p.team)}</span>${injChip(p)}${mine(p)}</div></div>
        <div class="projbox"><div class="lbl">Week ${nextW()} projection</div><div class="num">${proj(p) != null ? f1(proj(p)) : "–"}</div>
          <div class="small muted">${p.proj && !p.proj.bye ? `${esc(p.proj.opp)} ${grade(p.proj.grade)} · ${posRank(p)}` : p.proj && p.proj.bye ? "Bye week" : ""}</div></div></div>
      ${formula(p)}${modelNote(p)}
      <div class="stats3">
        <div class="stat"><div class="k">Season avg</div><div class="v">${f1(p.avg)}</div></div>
        <div class="stat"><div class="k">Last ${D.meta.recent_weeks}</div><div class="v">${f1(p.recent)}</div></div>
        ${usage(p).map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${k === "Tgt share" ? (v == null ? "–" : Math.round(v * 100) + "%") : f1(v)}</div></div>`).join("")}
      </div>
      <p class="small muted" style="margin:10px 0 0">${p.games} game${p.games === 1 ? "" : "s"} · ${f1(p.total)} total · range ${g.length ? f1(Math.min(...g)) + "–" + f1(Math.max(...g)) : "–"}${sd != null ? ` · week-to-week swing ±${f1(sd)}` : ""}</p>
    </div>
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Weekly points</h2>
      <div class="legend"><span><span class="sw" style="background:var(--series-1)"></span>Actual</span>${proj(p) ? `<span><span class="sw" style="background:transparent;border:2px dashed var(--turf)"></span>Week ${nextW()} projection</span>` : ""}</div></div>
      <div class="chart" id="pchart">${weeklyChart(series, { projection: p.proj && !p.proj.bye ? p.proj : null })}</div></div>
    <div class="card"><h2>Game log</h2><div class="tablewrap"><table><thead><tr><th>Wk</th><th>Opp</th><th class="num">Pts</th>${keys.map(([, l]) => `<th class="num">${l}</th>`).join("")}</tr></thead>
      <tbody>${p.weeks.slice().reverse().map((w) => `<tr><td>W${w.w}</td><td>${esc(w.opp)}</td><td class="num"><b>${f1(w.pts)}</b></td>${keys.map(([k]) => `<td class="num">${w[k] ?? "–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
    ${p.model && p.model.articles && p.model.articles.length ? `<div class="card"><h2>Recent news</h2>${articles(p.model.articles)}</div>` : ""}
    <div class="row"><button class="btn" id="cmpadd">Add to Compare</button><button class="btn primary" id="askabout">Ask about ${esc(p.name)}</button></div>`;
  bindChart($("#pchart"), series, p.proj && !p.proj.bye ? p.proj : null);
  $("#cmpadd").addEventListener("click", () => { const c = compareIds(); if (!c.includes(p.id)) c.push(p.id); S.compare = c.slice(-4); store.set("compare", S.compare); location.hash = "compare"; });
  $("#askabout").addEventListener("click", () => { S.draft = `How do you see ${p.name} in week ${nextW()}? Start or sit?`; location.hash = "ask"; });
}

function articles(list) {
  return `<ul class="arts">${list.map((a) => `<li><span class="chip ${a.score > 0.05 ? "good" : a.score < -0.05 ? "bad" : ""}">${sgn(a.score, 2)}</span>
    ${/^https?:\/\//i.test(a.link || "") ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : esc(a.title)}
    <span class="small muted">${esc(a.source || "")}</span></li>`).join("")}</ul>`;
}

// ---- Compare -------------------------------------------------------------------------------
const COLORS = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)"];
function compareIds() {
  if (S.compare && S.compare.length) return S.compare.filter((id) => byId.has(id));
  const mineSorted = D.players.filter((p) => p.mine && proj(p)).slice(0, 3);
  const pool = mineSorted.length >= 2 ? mineSorted : D.players.filter((p) => p.pos === "WR" && proj(p)).slice(0, 3);
  return pool.map((p) => p.id);
}

function pageCompare() {
  const ids = compareIds(), ps = ids.map((id) => byId.get(id));
  const example = !(S.compare && S.compare.length);
  view.innerHTML = `<div class="stack"><div class="row" id="ctop"></div><div id="cbody" class="stack" style="margin-top:0"></div></div>`;
  $("#ctop").append(searchBox(ps.length >= 4 ? "Remove a player to add another" : "Add a player to compare…", (x) => {
    const c = compareIds().filter((id) => id !== x.id); c.push(x.id); S.compare = c.slice(-4); store.set("compare", S.compare); pageCompare();
  }, "compare-search"));
  if (!ps.length) { $("#cbody").innerHTML = `<div class="card empty">Add two to four players to compare them side by side.</div>`; return; }
  const rows = [
    ["Week " + nextW() + " projection", (p) => proj(p), true, (v) => f1(v)],
    ["Position rank", (p) => (p.proj && p.proj.pos_rank) || null, false, (v, p) => (v ? posRank(p) : "–")],
    ["Matchup", (p) => (p.proj && p.proj.mult_matchup) || null, true, (v, p) => (p.proj && p.proj.bye ? "BYE" : p.proj ? `${esc(p.proj.opp)} ${grade(p.proj.grade)}` : "–")],
    [ps.some((p) => p.pos === "DEF") ? "Implied total (opponent's for D/ST)" : "Team implied total", (p) => (p.proj && p.proj.implied) || null,
      ps.every((p) => p.pos === "DEF") ? false : ps.some((p) => p.pos === "DEF") ? null : true, (v) => f1(v)],
    ["Last " + D.meta.recent_weeks + " avg", (p) => p.recent, true, (v) => f1(v)],
    ["Season avg", (p) => p.avg, true, (v) => f1(v)],
    ["Floor (worst game)", (p) => (pts(p).length ? Math.min(...pts(p)) : null), true, (v) => f1(v)],
    ["Ceiling (best game)", (p) => (pts(p).length ? Math.max(...pts(p)) : null), true, (v) => f1(v)],
    ["Week-to-week swing", (p) => stdev(pts(p)), false, (v) => (v == null ? "–" : "±" + f1(v))],
    ["Usage", (p) => null, null, (v, p) => usage(p).map(([k, u]) => `${k} ${k === "Tgt share" ? (u == null ? "–" : Math.round(u * 100) + "%") : f1(u)}`).join("<br>")],
    ["Status", (p) => null, null, (v, p) => injChip(p) || '<span class="muted">No report</span>'],
    ["Your pipeline", (p) => (p.model && p.model.adj) || null, true, (v, p) => (p.model ? `${f1(v)}${p.model.n_articles ? ` · news ${sgn(p.model.sentiment, 2)}` : ""}` : "–")],
  ].filter(([label]) => label !== "Your pipeline" || ps.some((p) => p.model));
  const best = (fn, higher) => { const vs = ps.map(fn).filter((v) => v != null); return vs.length > 1 ? (higher ? Math.max(...vs) : Math.min(...vs)) : null; };
  const series = ps.map((p, i) => ({ label: p.name, color: COLORS[i], weeks: p.weeks }));
  $("#cbody").innerHTML = `${example ? `<div class="banner">Example comparison${D.players.some((p) => p.mine) ? " from your roster" : " of top-projected WRs"}. Search above to add your own players.</div>` : ""}
    <div class="card"><div class="tablewrap"><table class="cmp"><thead><tr><th></th>${ps.map((p, i) => `<th class="num pl"><span class="sw" style="background:${COLORS[i]}"></span>${esc(p.name)} <span class="muted small">${esc(p.pos)} · ${esc(p.team)}</span> <button class="x" data-rm="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(([label, fn, higher, fmt]) => { const b = higher == null ? null : best(fn, higher);
        return `<tr><th>${label}</th>${ps.map((p) => { const v = fn(p); return `<td class="num ${b != null && v === b ? "best" : ""}">${fmt(v, p)}</td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>
      <p class="small muted" style="margin:10px 0 0">Green marks the best value in each row. Projections are the baseline model for week ${nextW()}.</p></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Weekly points</h2>
      <div class="legend">${series.map((s) => `<span><span class="sw line" style="background:${s.color}"></span>${esc(s.label)}</span>`).join("")}</div></div>
      <div class="chart" id="cchart">${weeklyChart(series)}</div></div>
    <div class="card" id="verdict"><div class="row" style="justify-content:space-between"><h2>Who should I start?</h2>
      <button class="btn primary" id="ask-verdict">Ask Claude</button></div><div id="verdict-out" class="small muted" style="margin-top:8px">Claude reads the numbers above and gives a start/sit call with reasons.</div></div>`;
  view.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { S.compare = compareIds().filter((id) => id !== b.dataset.rm); store.set("compare", S.compare); pageCompare(); }));
  bindChart($("#cchart"), series, null);
  $("#ask-verdict").addEventListener("click", () => verdict(ps));
}

function rules() {
  const m = D.meta, my = D.players.filter((p) => p.mine).map((p) => `${p.name} (${p.pos}, ${p.team})`);
  return `You are the fantasy football assistant inside "Brendobendo Scout", for the manager of team Brendobendo (Sleeper league, ${m.ppr} PPR).
Data: nflverse stats for the ${m.season} season through week ${m.through_week}; projections are for week ${m.next_week}. Data file built ${m.generated_at}.
Projection = baseline: ${Math.round(m.recent_weight * 100)}% last-${m.recent_weeks} avg + ${Math.round((1 - m.recent_weight) * 100)}% season avg, times a matchup factor (defense vs position and Vegas implied total) and an injury factor. It's simple and not calibrated; say so when it matters.
D/STs are position "DEF" (search "<team> D/ST"); they score sacks 1, INT 2, fumble recovery 2, TD 6, safety 2, blocked kick 2, plus points-allowed tiers (0: +10 down to 35+: -4). Their matchup factor uses how many D/ST points the opposing offense gives up and the opponent's implied total (lower is better).
${my.length ? `User's roster (${L ? `from Sleeper, exported ${L.meta.exported_at}` : `from their last pipeline run, week ${m.model_run.week}`}): ${my.join("; ")}.` : "The user's roster isn't in this data."}
${L ? `League tools: my_league (matchup, recommended vs. current lineup, alerts, waiver recommendations) and waiver_pool (free agents with add/drop what-ifs). "Model pts" there are the user's own pipeline (Sleeper projection blended with recent form, times injury, matchup, weather and news); prefer them for start/sit calls in this league and say when they differ from the baseline projection.` : ""}
Use the tools to look players up; never guess stats. You can't browse: for news, trades or injuries after the data date, say what the data shows and what to check. Lead with the answer (a clear start/sit or ranking), then 2-4 short reasons with numbers. Be concise. Use plain text with short "-" bullets; no tables.`;
}

function md(text) {  // tiny, safe markdown: paragraphs, "-" bullets, **bold**
  const blocks = esc(text).split(/\n{2,}/);
  return blocks.map((b) => {
    const lines = b.split("\n");
    const bold = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (lines.every((l) => /^\s*[-*•] /.test(l))) return `<ul>${lines.map((l) => `<li>${bold(l.replace(/^\s*[-*•] /, ""))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(bold).join("<br>")}</p>`;
  }).join("");
}

const ERR = { not_granted: "Claude access was declined for this page.", sampling_disabled: "Claude isn't available for this account.",
  rate_limited: "Too many questions at once. Try again in a minute.", session_expired: "Sign in to Claude again, then retry.",

let ctl = null;
async function pageAsk() {
  const sample = await getSample();
  if (location.hash.replace("#", "") !== "ask") return;
  const suggestions = [...(L ? ["How does my matchup look, and should I change anything?", "Which waiver add helps me most, and what should I bid?"] : []),
    `Who are the top 5 WRs for week ${nextW()}?`, "Which of my players are trending up over the last 3 weeks?",
    `Which RBs have the easiest matchups in week ${nextW()}?`, "Who should I start at FLEX this week?"];
  view.innerHTML = `<div class="stack"><div class="card">
      <div class="chat" id="chat"></div>
      ${sample ? `<form class="composer" id="composer"><textarea id="ask-input" rows="2" placeholder="Ask about a player, a matchup, start/sit…"></textarea>
        <button class="btn primary" id="send" type="submit">Send</button><button class="btn" id="stop" type="button" hidden>Stop</button></form>
        <div class="suggest">${suggestions.map((s) => `<button class="pill" type="button" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>`
      : `<p class="banner">Ask needs Claude, which isn't available in this view. Open the page in Claude while signed in.</p>`}
    </div><div class="row" style="justify-content:space-between"><span class="small muted">Answers use this page's data (through week ${D.meta.through_week}) and your own Claude usage.</span>
      <button class="btn" id="clear" type="button">Clear chat</button></div></div>`;
  const chat = $("#chat");
  const paint = () => {
    chat.innerHTML = S.turns.length ? S.turns.map((t) => `<div class="msg ${t.role === "user" ? "user" : "bot"}">${t.role === "user" ? esc(t.content) : md(t.content)}</div>`).join("")
      : `<div class="empty">Ask anything about players in the data: projections, matchups, recent form, start/sit calls.</div>`;
  };
  paint();
  $("#clear").addEventListener("click", () => { ctl?.abort(); S.turns = []; store.set("turns", []); paint(); });
  if (!sample) return;
  const input = $("#ask-input");
  if (S.draft) { input.value = S.draft; S.draft = null; input.focus(); }
  view.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => { input.value = b.dataset.s; $("#composer").requestSubmit(); }));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });
  $("#stop").addEventListener("click", () => ctl?.abort());
  $("#composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || ctl) return;
    input.value = "";
    S.turns.push({ role: "user", content: q });
    paint();
    const bubble = document.createElement("div");
    bubble.className = "msg bot";
    bubble.innerHTML = `<span class="muted">Thinking…</span>`;
    chat.append(bubble);
    $("#send").disabled = true; $("#stop").hidden = false;
    ctl = new AbortController();
    const looked = [];
    const tools = (L ? [...TOOLS, ...LEAGUE_TOOLS] : TOOLS).map((t) => ({ ...t, execute: (inp, c) => { looked.push(t.name === "get_player" ? String(inp.player) : t.name.replace("_", " ")); bubble.innerHTML = `<span class="muted">Looking up ${esc(looked.slice(-3).join(", "))}…</span>`; return t.execute(inp, c); } }));
    try {
      const turns = S.turns.slice(-12);
      const { text, truncated } = await sample([{ role: "user", content: rules() }, ...turns], {
        tools, signal: ctl.signal, onText: ({ text }) => { bubble.innerHTML = md(text); chat.lastElementChild?.scrollIntoView({ block: "nearest" }); } });
      S.turns.push({ role: "assistant", content: text + (truncated ? "\n\n(Answer cut short.)" : "") });
      store.set("turns", S.turns.slice(-30));
      paint();
    } catch (err) {
      if (err.code !== "cancelled") {
        bubble.innerHTML = (err.text ? md(err.text) : "") + `<div class="meta">${esc(ERR[err.code] || "Something went wrong reaching Claude. Try again.")}</div>`;
      } else bubble.innerHTML = err.text ? md(err.text) : `<span class="muted">Stopped.</span>`;
      if (err.text) { S.turns.push({ role: "assistant", content: err.text }); store.set("turns", S.turns.slice(-30)); }
    } finally {
      ctl = null; $("#send") && ($("#send").disabled = false); $("#stop") && ($("#stop").hidden = true);
    }
  });
}

Compare these players for week ${nextW()} and say who to start (rank them if more than two). Lead with the call, then 2-3 bullets of reasons with numbers, and one line on risk.

// ---- League tabs (Summary, Matchup, Roster, Waivers): read league.json, the web app's own JSON -----
const LP = () => (L && L.summary && L.summary.players) || {};
const lname = (pid) => (LP()[pid] && LP()[pid].name) || (L && L.players[pid] && L.players[pid].name) || pid;
const levalOf = (pid) => LP()[pid] || (L && L.players[pid] && L.players[pid].eval) || null;
const sid = (pid) => { const x = L && L.scout_ids && L.scout_ids[pid]; return x && byId.has(x) ? x : null; };
const plink = (pid, name) => { const x = sid(pid), n = esc(name ?? lname(pid));
  return x ? `<button type="button" class="plink" data-goto="${esc(x)}">${n}</button>` : `<b>${n}</b>`; };
const posTag = (pos) => `<span class="pos">${esc(pos || "")}</span>`;
const signed = (v, d = 1) => (v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d));
const dcls = (v) => (v == null ? "" : v > 0.05 ? "up" : v < -0.05 ? "down" : "");
const oppText = (e) => (e.on_bye ? "BYE" : !e.opp ? "–" : String(e.opp).match(/^(vs|@) /) ? e.opp : (e.is_home ? "vs " : "@ ") + e.opp);
const ago = (iso) => { const m = (Date.now() - new Date(iso)) / 60000;
  return m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 48 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
const atTime = (iso) => new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });

function injShort(status) {
  if (!status) return "";
  const cls = status === "Questionable" ? "warn" : ["Doubtful", "Out", "IR", "PUP", "Sus", "COV"].includes(status) ? "bad" : "";
  const short = { Questionable: "Q", Doubtful: "D", Out: "OUT", Suspended: "SUS" }[status] || status;
  return `<span class="chip ${cls}" title="${esc(status)}">${esc(short)}</span>`;
}

function needLeague(what) {
  view.innerHTML = `<div class="card empty" style="margin-top:16px"><h2>${what} needs your league data</h2>
    <p>This copy of Scout was published without <span class="mono">league.json</span>. It arrives with the next scheduled refresh,
    after the GitHub <b>predict</b> job has exported your league.</p><p><a href="#player">Open the Player tab →</a></p></div>`;
}

// The lineup Sleeper has now vs. the one the latest run recommends.
function lineupDiff(s) {
  const opt = s.lineup.map((l) => l.player_id).filter(Boolean), optSet = new Set(opt);
  const synced = !!(L.roster && L.roster.same_week);
  const live = new Set(synced ? L.roster.starters : s.current_starters);
  return { live, synced, start: opt.filter((id) => !live.has(id)), bench: [...live].filter((id) => !optSet.has(id) && s.players[id]) };
}

function runNote(s) {
  const run = new Date(s.meta.generated_at), stale = L.matchup && L.matchup.week !== s.meta.week;
  const drift = L.roster && (L.roster.added.length || L.roster.dropped.length);
  const list = (xs) => xs.map((p) => esc(p.name)).join(", ");
  return (stale ? `<div class="banner">The latest pipeline run is for week ${s.meta.week}, but it's week ${L.matchup.week} now. The next scheduled run will catch up.</div>` : "")
    + (drift ? `<div class="banner"><b>Your Sleeper roster changed since the last run</b> (${atTime(run)}).
      ${L.roster.added.length ? `Added ${list(L.roster.added)}.` : ""} ${L.roster.dropped.length ? `Dropped ${list(L.roster.dropped)}.` : ""}
      Recommendations still reflect the old roster until the next run.</div>` : "");
}

const MULTS = [["mult_injury", "injury"], ["mult_matchup", "matchup"], ["mult_weather", "weather"], ["mult_sentiment", "news"]];
const multChips = (e) => MULTS.filter(([k]) => e[k] != null && Math.abs(e[k] - 1) >= 0.005)   // hide anything that rounds to ×1.00
  .map(([k, l]) => `<span class="chip ${e[k] > 1 ? "good" : "bad"}">×${e[k].toFixed(2)} ${l}</span>`).join(" ");

function whyPanel(e) {
  const w = (L.summary && L.summary.meta.weights) || { projection: 0.7, recent_form: 0.3 };
  const cls = (m) => (m > 1.0005 ? "up" : m < 0.9995 ? "down" : "");
  const term = (k, v, c = "", title = "") => `<div class="term ${c}" title="${esc(title)}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const meta = [];
  if (e.proj != null || e.recent_avg != null) meta.push(`Base = ${w.projection} × Sleeper projection ${f1(e.proj)} + ${w.recent_form} × recent ${f1(e.recent_avg)}`);
  if (e.def_rank) meta.push(`Opponent ranks ${e.def_rank} of ${e.def_teams} vs ${esc(e.position)}s (${e.def_ratio}× average allowed)`);
  if (e.implied != null) meta.push(`Team implied total ${f1(e.implied)}`);
  if (e.weather) meta.push(`Weather: ${esc(e.weather)}`);
  if (e.n_articles) meta.push(`News: ${e.n_articles} articles, sentiment ${signed(e.sentiment, 2)}`);
  if (e.notes && e.notes.length) meta.push(esc(e.notes.join(", ")));
  return `<div class="formula">${term("Base", f1(e.base))}<span class="op">×</span>
    ${term("Injury", (e.mult_injury ?? 1).toFixed(2), cls(e.mult_injury), e.injury_status || "healthy")}<span class="op">×</span>
    ${term("Matchup", (e.mult_matchup ?? 1).toFixed(2), cls(e.mult_matchup))}<span class="op">×</span>
    ${term("Weather", (e.mult_weather ?? 1).toFixed(2), cls(e.mult_weather), e.weather || "no forecast")}<span class="op">×</span>
    ${term("News", (e.mult_sentiment ?? 1).toFixed(2), cls(e.mult_sentiment))}<span class="op">=</span>${term("Adj pts", f1(e.adj))}</div>
    <div class="why-meta">${meta.map((x) => `<span>${x}</span>`).join("") || "<span>No matchup, weather or news signals.</span>"}</div>
    ${sid(e.player_id) ? `<p class="small" style="margin:8px 0 0">${plink(e.player_id, "Open player page →")}</p>` : ""}`;
}

function bidWhy(d) {
  if (!d || d.value === undefined) return "";
  return [`${f1(d.value)} pts of value over ${d.horizon + 1} weeks vs. the drop`,
    d.teams ? `${d.rivals} of ${d.teams} other teams would start him${d.rival_max_budget != null ? ` (richest has $${d.rival_max_budget})` : ""}` : "",
    d.trending_adds ? `${d.trending_adds.toLocaleString()} Sleeper adds in 48h` : "not trending"].filter(Boolean).join(" · ") + ` → ${Math.round(d.pct * 100)}% of budget`;
}

// ---- Summary -----------------------------------------------------------------------------
function pageSummary() {
  if (!L || !L.summary) return needLeague("The summary");
  const s = L.summary, P = s.players, recs = s.waiver_recs || [], m = L.matchup;
  const diff = lineupDiff(s);
  const holes = s.lineup.filter((l) => !l.player_id || !P[l.player_id] || P[l.player_id].adj <= 0);
  const items = [];
  diff.start.forEach((id) => items.push(["START", "good", `${plink(id)} ${posTag(P[id].position)} <span class="muted">${f1(P[id].adj)} adj · ${esc(oppText(P[id]))}</span>`]));
  diff.bench.forEach((id) => items.push(["BENCH", "warn", `${plink(id)} ${posTag(P[id].position)} <span class="muted">${f1(P[id].adj)} adj${P[id].notes && P[id].notes.length ? " · " + esc(P[id].notes.join(", ")) : ""}</span>`]));
  holes.forEach((l) => items.push(["HOLE", "bad", l.player_id && P[l.player_id]
    ? `No healthy <b>${esc(l.slot)}</b>: ${plink(l.player_id)} (${esc((P[l.player_id].notes || []).join(", ") || "no projection")}). <a href="#waivers">Check waivers</a>`
    : `Nobody eligible for <b>${esc(l.slot)}</b>. <a href="#waivers">Check waivers</a>`]));
  const seen = new Set([...diff.bench, ...holes.map((l) => l.player_id)]);
  (s.alerts || []).filter((id) => !seen.has(id) && P[id]).forEach((id) => items.push(["ALERT", "warn", `${plink(id)} ${posTag(P[id].position)} <span class="muted">${esc((P[id].notes || []).join(", "))}</span>`]));
  recs.slice(0, 3).forEach((r) => items.push(["ADD", "turf", `${plink(r.player_id)} ${posTag(P[r.player_id] && P[r.player_id].position)}
    <span class="muted">${signed(r.weekly_gain)} this week · ${signed(r.ros_gain)} vs drop</span>${r.drop_id ? ` · drop ${plink(r.drop_id)}` : ""} · <b>${esc(r.bid)}</b>`]));

  const wp = m && m.win_prob != null ? Math.round(m.win_prob * 100) : null, top = recs[0];
  const lineupRows = s.lineup.map((l) => {
    const e = l.player_id && P[l.player_id];
    if (!e) return `<tr><td class="muted">${esc(l.slot)}</td><td colspan="3" class="muted">(empty)</td></tr>`;
    return `<tr class="${diff.live.has(e.player_id) ? "" : "flag-start"}"><td class="muted small">${esc(l.slot)}</td>
      <td>${plink(e.player_id, e.name)} ${injShort(e.injury_status)}<div class="small muted">${esc(oppText(e))} <span class="hide-sm">${multChips(e)}</span></div></td>
      <td class="adj">${f1(e.adj)}</td></tr>`;
  }).join("");
  view.innerHTML = `<div class="stack">${runNote(s)}
    <div class="tiles">
      <a class="tile ${wp == null ? "" : wp >= 60 ? "good" : wp >= 40 ? "warn" : "bad"}" href="#matchup"><div class="k">Week ${m ? m.week : s.meta.week} matchup</div>
        <div class="v">${wp == null ? "–" : wp + "%"}</div><div class="h">${m && m.me && m.opponent ? `${f1(m.me.points)}–${f1(m.opponent.points)} vs ${esc(m.opponent.name)}` : "no head-to-head"}</div></a>
      <a class="tile ${diff.start.length ? "warn" : "good"}" href="#roster"><div class="k">Lineup changes</div><div class="v">${diff.start.length || "✓"}</div>
        <div class="h">${diff.start.length ? "vs. your Sleeper lineup" : "Sleeper lineup matches"}</div></a>
      <div class="tile ${(s.alerts || []).length || holes.length ? "bad" : "good"}"><div class="k">Injury / bye alerts</div><div class="v">${(s.alerts || []).length}</div>
        <div class="h">${holes.length ? `${holes.length} empty slot${holes.length > 1 ? "s" : ""}` : "on your active roster"}</div></div>
      <a class="tile ${top ? "turf" : ""}" href="#waivers"><div class="k">Top waiver target</div>
        ${top ? `<div class="v sm">${esc(lname(top.player_id))}</div><div class="h">${signed(top.weekly_gain)} pts this week · ${esc(top.bid)}</div>`
              : `<div class="v sm muted">None</div><div class="h">nobody clears the thresholds</div>`}</a>
    </div>
    <div class="grid2">
      <div class="card"><h2>Before kickoff</h2>
        ${items.length ? `<ul class="checklist">${items.map(([t, c, h]) => `<li><span class="chip ${c}">${t}</span><span>${h}</span></li>`).join("")}</ul>`
                       : `<p class="muted">Nothing to do. Your lineup is set and there are no alerts.</p>`}</div>
      <div class="card"><div class="row" style="justify-content:space-between"><h2>Recommended lineup</h2><span class="small muted">projected ${f1(s.total)}</span></div>
        <div class="tablewrap"><table><tbody>${lineupRows}</tbody></table></div>
        <p class="small muted" style="margin:10px 0 0">Green edge: recommended but not in your Sleeper lineup. <a href="#roster">Full roster and breakdowns →</a></p></div>
    </div>
    ${(s.warnings || []).length ? `<details class="card"><summary>Run warnings (${s.warnings.length})</summary><ul class="small">${s.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>` : ""}
    <p class="small muted">Latest run ${esc(atTime(s.meta.generated_at))} (news ${s.meta.options && s.meta.options.news === false ? "off" : "on"}, weather ${s.meta.options && s.meta.options.weather === false ? "off" : "on"}) ·
      league data exported ${esc(ago(L.meta.exported_at))}${diff.synced ? " · lineup compared with Sleeper at export time" : ""}.</p></div>`;
  bindLeague(view);
}

// ---- Matchup -----------------------------------------------------------------------------
function gameChip(r) {
  if (!r.player_id) return "";
  if (r.state === "final") return `<span class="chip">Final</span>`;
  if (r.state === "live") return `<span class="chip live">Live · ${Math.round(r.frac * 100)}%</span>`;
  if (r.state === "bye") return `<span class="chip bad">BYE</span>`;
  if (r.state === "upcoming" && r.kickoff) return `<span class="chip">${esc(atTime(r.kickoff))}</span>`;
  return "";
}
function mCells(r, side) {
  if (!r || !r.player_id) return side === "l" ? `<td class="muted">(empty)</td><td class="pts l">–</td>` : `<td class="pts r">–</td><td class="r muted">(empty)</td>`;
  const who = `<td class="${side === "r" ? "r" : ""}">${plink(r.player_id, r.name)} ${injShort(r.injury_status)}
    <div class="small muted">${esc(r.position)} · ${esc(r.team || "FA")} ${esc(r.opp && r.opp !== "BYE" ? r.opp : "")}</div><div>${gameChip(r)}</div></td>`;
  const pts = `<td class="pts ${side}">${f1(r.points)}<div class="sub">${r.state === "final" ? "final" : "proj " + f1(r.proj_final)}</div></td>`;
  return side === "l" ? who + pts : pts + who;
}
function pageMatchup() {
  if (!L || !L.matchup) return needLeague("The matchup");
  const m = L.matchup, me = m.me, op = m.opponent;
  if (!me) { view.innerHTML = `<div class="card empty" style="margin-top:16px"><h2>No matchup for week ${m.week}</h2><p>Sleeper has no head-to-head for your team this week.</p></div>`; return; }
  const wp = m.win_prob == null ? null : Math.round(m.win_prob * 100), sw = m.swaps;
  const cols = `<colgroup><col><col class="p"><col class="s"><col class="p"><col></colgroup>`;
  const rows = me.starters.map((r, i) => `<tr>${mCells(r, "l")}<td class="slot">${esc(r.slot)}</td>${mCells(op && op.starters[i], "r")}</tr>`).join("");
  const bench = (t) => (t && t.bench.length ? t.bench.map((r) => `<tr>${mCells(r, "l")}</tr>`).join("") : `<tr><td class="muted">Empty</td></tr>`);
  const anyLive = [...me.starters, ...(op ? op.starters : [])].some((r) => r.state === "live");
  view.innerHTML = `<div class="stack">
    <div class="card scoreboard">
      <div class="sb-team"><div class="sb-name">${esc(me.name)}</div><div class="sb-pts">${f1(me.points)}</div><div class="small muted">proj ${f1(me.proj_final)}</div></div>
      <div class="sb-mid">${wp == null ? `<span class="muted">vs</span>` : `<div class="small muted">Win prob</div><div class="sb-wp">${wp}%</div><div class="wpbar"><span style="width:${wp}%"></span></div>`}</div>
      <div class="sb-team r"><div class="sb-name">${esc(op ? op.name : "No opponent")}</div><div class="sb-pts">${op ? f1(op.points) : "–"}</div><div class="small muted">${op ? "proj " + f1(op.proj_final) : ""}</div></div>
    </div>
    ${sw && (sw.start.length || sw.bench.length) ? `<div class="banner"><b>Lineup check:</b> the latest run would start ${sw.start.map((id) => plink(id)).join(", ") || "nobody new"}
      and bench ${sw.bench.map((id) => plink(id)).join(", ") || "nobody"}. Make the change in Sleeper before kickoff.</div>`
      : sw ? `<div class="banner info">Your Sleeper lineup matches the latest run's recommendation.</div>` : ""}
    <div class="card"><div class="tablewrap"><table class="mt">${cols}<tbody>${rows}</tbody>
      <tfoot><tr><td><b>Total</b></td><td class="pts l">${f1(me.points)}</td><td></td><td class="pts r">${op ? f1(op.points) : "–"}</td><td class="r"><b>Total</b></td></tr></tfoot></table></div></div>
    <div class="grid2">
      <details class="card"><summary>${esc(me.name)} bench</summary><div class="tablewrap"><table class="mt"><colgroup><col><col class="p"></colgroup><tbody>${bench(me)}</tbody></table></div></details>
      ${op ? `<details class="card"><summary>${esc(op.name)} bench</summary><div class="tablewrap"><table class="mt"><colgroup><col><col class="p"></colgroup><tbody>${bench(op)}</tbody></table></div></details>` : ""}
    </div>
    <p class="small muted">Scores as of ${esc(atTime(m.fetched_at))} (${esc(ago(m.fetched_at))})${anyLive ? ". Games are in progress; scores refresh hourly while games are on" : ""}.
      Projections are the model's adjusted points (your opponent's without news). Live progress is estimated from kickoff time, and win probability
      assumes each player's remaining output varies by about ${Math.round(((L.config && L.config.ui && L.config.ui.player_sd_ratio) || 0.5) * 100)}% of the projection.</p></div>`;
  bindLeague(view);
}

// ---- Roster ------------------------------------------------------------------------------
function rosterRow(e, flag, slot) {
  return `<tr class="clickable ${flag ? "flag-" + flag : ""}" data-expand="${esc(e.player_id)}">
    <td style="white-space:normal">${slot && slot !== e.position ? `<span class="pos">${esc(slot)}</span> ` : ""}${plink(e.player_id, e.name)} ${injShort(e.injury_status)}
      ${flag === "start" ? `<span class="chip good">START</span>` : flag === "bench" ? `<span class="chip warn">BENCH</span>` : ""}
      <div class="small muted">${posTag(e.position)} ${esc(e.team || "FA")} · ${esc(oppText(e))} ${grade(e.matchup_grade && e.matchup_grade !== "-" ? e.matchup_grade : "")}</div></td>
    <td class="num">${f1(e.proj)}</td><td class="num hide-sm">${f1(e.recent_avg)}</td>
    <td class="hide-sm" style="white-space:normal">${multChips(e)}</td><td class="adj">${f1(e.adj)}</td></tr>
    <tr class="detail" data-detail="${esc(e.player_id)}" hidden><td colspan="5">${whyPanel(e)}</td></tr>`;
}
function pageRoster() {
  if (!L || !L.summary) return needLeague("Your roster");
  const s = L.summary, P = s.players, live = lineupDiff(s).live;
  const starterIds = new Set(s.lineup.map((l) => l.player_id).filter(Boolean));
  const head = `<thead><tr><th>Player</th><th class="num" title="Sleeper projection">Proj</th><th class="num hide-sm">Recent</th><th class="hide-sm">Adjustments</th><th class="adj" title="Model points: base × injury × matchup × weather × news">Adj</th></tr></thead>`;
  const starters = s.lineup.filter((l) => l.player_id && P[l.player_id]).map((l) => rosterRow(P[l.player_id], live.has(l.player_id) ? "" : "start", l.slot)).join("");
  const bench = Object.values(P).filter((e) => e.group === "roster" && !starterIds.has(e.player_id)).sort((a, b) => b.adj - a.adj)
    .map((e) => rosterRow(e, live.has(e.player_id) ? "bench" : "", null)).join("");
  const reserve = Object.values(P).filter((e) => e.group === "reserve").map((e) => rosterRow(e, "", null)).join("");
  view.innerHTML = `<div class="stack">${runNote(s)}
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Starters</h2><span class="small muted">recommended · projected ${f1(s.total)}</span></div>
      <div class="tablewrap"><table>${head}<tbody>${starters}</tbody></table></div></div>
    <div class="card"><h2>Bench</h2><div class="tablewrap"><table>${head}<tbody>${bench || `<tr><td colspan="5" class="muted">Empty</td></tr>`}</tbody></table></div></div>
    ${reserve ? `<div class="card"><h2>IR / Taxi</h2><div class="tablewrap"><table>${head}<tbody>${reserve}</tbody></table></div></div>` : ""}
    <p class="small muted"><span class="chip good">START</span> recommended but not in your Sleeper lineup · <span class="chip warn">BENCH</span> in your Sleeper lineup
      but the model would bench him. Tap a row for the breakdown: Adj = base × injury × matchup × weather × news.</p></div>`;
  bindLeague(view);
}

// ---- Waivers -----------------------------------------------------------------------------
const W = { mode: store.get("wmode", "rec"), q: "", pos: new Set(), hideInj: false, sort: "adj", n: 30 };
const WSORT = [["adj", "Adj"], ["proj", "Proj"], ["recent_avg", "Recent"], ["ppg", "Pts/game"], ["trending_adds", "Adds 48h"]];
function whatifText(pid) {
  const r = L.waivers.whatif[pid];
  if (!r) return `<span class="small muted">Not precomputed: what-ifs cover the top ${L.meta.whatif_players} free agents.</span>`;
  return `<span class="diff ${dcls(r.weekly_gain)}">${signed(r.weekly_gain)}</span> this week · <span class="diff ${dcls(r.ros_gain)}">${signed(r.ros_gain)}</span> vs
    ${r.drop ? plink(r.drop.player_id, r.drop.name) : "the drop"} · bid <b title="${esc(bidWhy(r.bid_detail))}">${esc(r.bid)}</b>`;
}
function pageWaivers() {
  if (!L || !L.summary) return needLeague("Waivers");
  const s = L.summary;
  view.innerHTML = `<div class="stack">${runNote(s)}<div class="row" style="justify-content:space-between">
      <div class="seg" role="tablist"><button type="button" data-mode="rec" class="${W.mode === "rec" ? "on" : ""}">Recommended</button>
        <button type="button" data-mode="browse" class="${W.mode === "browse" ? "on" : ""}">Browse free agents</button></div>
      <span class="small muted">${s.meta.faab ? `FAAB left $${s.meta.budget_left} · ` : ""}week ${s.meta.week}</span></div><div id="wbody" class="stack" style="margin-top:0"></div></div>`;
  view.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { W.mode = b.dataset.mode; store.set("wmode", W.mode); pageWaivers(); }));
  if (W.mode === "rec") waiverRecs($("#wbody")); else waiverBrowse($("#wbody"));
  bindLeague(view);
}
function waiverRecs(el) {
  const s = L.summary, P = s.players, recs = s.waiver_recs || [];
  if (!recs.length) { el.innerHTML = `<div class="card empty"><h2>No free agents clear the thresholds</h2><p>Browse the pool to look through everyone.</p></div>`; return; }
  el.innerHTML = `<div class="card"><h2>Recommended adds</h2><div class="tablewrap"><table><thead><tr><th>Player</th><th class="adj">Adj</th>
      <th class="num" title="Change in this week's best lineup total">Gain</th><th class="num" title="Value vs. the suggested drop, rest of season">Vs drop</th><th>Bid</th></tr></thead><tbody>
    ${recs.map((r) => { const e = P[r.player_id] || { name: lname(r.player_id) };
      return `<tr class="clickable" data-expand="${esc(r.player_id)}"><td>${plink(r.player_id, e.name)} ${injShort(e.injury_status)}
          <div class="small muted">${posTag(e.position)} ${esc(e.team || "")} · ${esc(oppText(e))}${r.drop_id ? ` · drop ${esc(lname(r.drop_id))}` : ""}</div></td>
        <td class="adj">${f1(e.adj)}</td><td class="num"><span class="diff ${dcls(r.weekly_gain)}">${signed(r.weekly_gain)}</span></td>
        <td class="num"><span class="diff ${dcls(r.ros_gain)}">${signed(r.ros_gain)}</span></td><td><b>${esc(r.bid)}</b></td></tr>
        <tr class="detail" data-detail="${esc(r.player_id)}" hidden><td colspan="5">${e.base != null ? whyPanel(e) : ""}
          ${r.bid_detail && r.bid_detail.value !== undefined ? `<div class="why-meta"><span><b>Why ${esc(String(r.bid).split(" ")[0])}:</b> ${esc(bidWhy(r.bid_detail))}</span></div>` : ""}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="small muted" style="margin:10px 0 0">Gain is the change in this week's best lineup total. Vs drop compares projection and recent form with the suggested drop. Tap a row for the reasoning behind the bid.</p></div>`;
}
function waiverBrowse(el) {
  const pool = L.waivers.pool.players || [];
  el.innerHTML = `<div class="row">
      <div class="search" style="flex:1 1 200px"><input id="wq" type="search" placeholder="Search free agents…" value="${esc(W.q)}" aria-label="Search free agents"></div>
      ${["QB", "RB", "WR", "TE", "K", "DEF"].map((p) => `<button type="button" class="pill ${W.pos.has(p) ? "on" : ""}" data-pos="${p}">${p}</button>`).join("")}
    </div><div class="row small">
      <label for="wsort">Sort</label><select id="wsort">${WSORT.map(([k, l]) => `<option value="${k}" ${W.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label><input type="checkbox" id="winj" ${W.hideInj ? "checked" : ""}> Hide injured</label></div><div class="card" id="wlist"></div>`;
  const draw = () => {
    const q = W.q.trim().toLowerCase();
    const rows = pool.filter((p) => (!q || p.name.toLowerCase().includes(q)) && (!W.pos.size || W.pos.has(p.position)) && (!W.hideInj || !p.injury_status))
      .sort((a, b) => (b[W.sort] ?? -1e9) - (a[W.sort] ?? -1e9));
    const shown = rows.slice(0, W.n);
    $("#wlist").innerHTML = `<div class="tablewrap"><table><thead><tr><th>Player</th><th class="adj">Adj</th><th class="num">Proj</th>
        <th class="num hide-sm">Recent</th><th class="num hide-sm">Pts/g</th><th class="num hide-sm">Adds 48h</th></tr></thead><tbody>
      ${shown.map((p) => `<tr class="clickable" data-expand="${esc(p.player_id)}"><td>${plink(p.player_id, p.name)} ${injShort(p.injury_status)}
          ${p.recommended ? `<span class="chip turf">rec</span>` : ""}<div class="small muted">${posTag(p.position)} ${esc(p.team)} · ${esc(oppText(p))} ${grade(p.matchup_grade && p.matchup_grade !== "-" ? p.matchup_grade : "")}</div></td>
        <td class="adj">${f1(p.adj)}</td><td class="num">${f1(p.proj)}</td><td class="num hide-sm">${f1(p.recent_avg)}</td><td class="num hide-sm">${f1(p.ppg)}</td>
        <td class="num hide-sm">${p.trending_adds ? p.trending_adds.toLocaleString() : "–"}</td></tr>
        <tr class="detail" data-detail="${esc(p.player_id)}" hidden><td colspan="6"><b>What if you add him?</b> ${whatifText(p.player_id)}</td></tr>`).join("")
        || `<tr><td colspan="6" class="muted">No free agents match these filters.</td></tr>`}</tbody></table></div>
      ${rows.length > W.n ? `<div class="more"><button type="button" class="btn" id="wmore">Show more (${rows.length - W.n} left)</button></div>` : ""}
      <p class="small muted" style="margin:10px 0 0">${rows.length} of the top ${pool.length} free agents by adjusted points (live estimates without news).
        Tap a player for the what-if: the lineup gain, the suggested drop and a FAAB bid.</p>`;
    const more = $("#wmore"); if (more) more.addEventListener("click", () => { W.n += 30; draw(); });
  };
  let t = null;
  $("#wq").addEventListener("input", (ev) => { clearTimeout(t); t = setTimeout(() => { W.q = ev.target.value; W.n = 30; draw(); }, 120); });
  el.querySelectorAll("[data-pos]").forEach((b) => b.addEventListener("click", () => { W.pos.has(b.dataset.pos) ? W.pos.delete(b.dataset.pos) : W.pos.add(b.dataset.pos); b.classList.toggle("on"); W.n = 30; draw(); }));
  $("#wsort").addEventListener("change", (ev) => { W.sort = ev.target.value; draw(); });
  $("#winj").addEventListener("change", (ev) => { W.hideInj = ev.target.checked; W.n = 30; draw(); });
  draw();
}

// ---- shell -----------------------------------------------------------------------------------
function route() {
  const tabs = ["summary", "matchup", "roster", "waivers", "player", "compare", "news", "ask"];
  const t = tabs.includes(location.hash.slice(1)) ? location.hash.slice(1) : L ? "summary" : "player";
  document.querySelectorAll("#tabs a").forEach((a) => (a.dataset.t === t ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  $("#tip").hidden = true;
  if (t !== "ask") ctl?.abort();
  ({ summary: pageSummary, matchup: pageMatchup, roster: pageRoster, waivers: pageWaivers,
     player: pagePlayer, compare: pageCompare, news: pageNews, ask: pageAsk })[t]();
  store.set("tab", t);
}

(async function init() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`data.json returned ${r.status}`);
    D = await r.json();
  } catch (e) {
    $("#fresh").textContent = "";
    view.innerHTML = `<div class="card empty" style="margin-top:16px"><h2>Player data didn't load</h2><p>${esc(e.message)}. Republish Scout with its data file.</p></div>`;
    return;
  }
  D.players.forEach((p) => byId.set(p.id, p));
  try {
    const r = await fetch("league.json", { cache: "no-store" });
    if (r.ok) L = await r.json();
  } catch { /* published without league data: player tools still work */ }
  if (L && L.roster && L.scout_ids) {   // your live Sleeper roster decides "mine", not the last pipeline run
    const mine = new Set([...(L.roster.players || [])].map((pid) => L.scout_ids[pid]).filter(Boolean));
    D.players.forEach((p) => { if (mine.has(p.id)) p.mine = true; else delete p.mine; });
  }
  const m = D.meta, when = (iso) => new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  $("#fresh").textContent = `Stats through week ${m.through_week} · week ${m.next_week} projections`
    + (L ? ` · league data ${when(L.meta.exported_at)}` : ` · updated ${when(m.generated_at)}`)
    + (m.model_run ? " · includes your pipeline run" : "");
  const home = L ? "summary" : "player", saved = store.get("tab", home);
  if (!location.hash && saved !== home) { location.hash = saved; return; }   // hashchange renders it
  route();
})();
window.addEventListener("hashchange", route);
</script>
