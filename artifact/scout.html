<title>Brendobendo Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single scouting column; a sticky header carries the tabs, cards stack below at phone width */
:root {
  --bg: #f3f6f2; --surface: #ffffff; --surface-2: #e9efe8; --line: #d8e0d6;
  --ink: #132019; --ink-2: #4a5a50; --muted: #76857b;
  --turf: #1b7a4c; --turf-ink: #ffffff; --turf-soft: #dcefe3; --chalk: #fbfcfa;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #c98500;
  --good: #0f7d34; --good-bg: #dff3e5; --warn: #8a5a00; --warn-bg: #fbefd2; --bad: #b02a2a; --bad-bg: #fbe3e3;
  --info-bg: #e3edf9; --shadow: 0 10px 28px rgba(19, 32, 25, .18);
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1310; --surface: #141c17; --surface-2: #1c2620; --line: #26322b;
  --ink: #edf3ee; --ink-2: #a9b8ae; --muted: #7d8c82;
  --turf: #3fae78; --turf-ink: #06140c; --turf-soft: #183a28; --chalk: #141c17;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #6fd38e; --good-bg: #173322; --warn: #f2b84b; --warn-bg: #362a12; --bad: #ff8f8f; --bad-bg: #3d1c1c;
  --info-bg: #17263a; --shadow: 0 10px 28px rgba(0, 0, 0, .5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1310; --surface: #141c17; --surface-2: #1c2620; --line: #26322b;
  --ink: #edf3ee; --ink-2: #a9b8ae; --muted: #7d8c82;
  --turf: #3fae78; --turf-ink: #06140c; --turf-soft: #183a28; --chalk: #141c17;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #6fd38e; --good-bg: #173322; --warn: #f2b84b; --warn-bg: #362a12; --bad: #ff8f8f; --bad-bg: #3d1c1c;
  --info-bg: #17263a; --shadow: 0 10px 28px rgba(0, 0, 0, .5);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
a { color: var(--turf); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; }
h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin-top: 14px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .strong { font-weight: 700; } .nw { white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; }
.brand { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; justify-content: space-between; }
.brand-l { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.brand h1 span { color: var(--turf); }
.fresh { font-size: 12.5px; color: var(--ink-2); }
#run-picker { font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; }
#run-picker.archived { border-color: var(--turf); background: var(--turf-soft); }
nav.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 8px 12px 10px; text-decoration: none; color: var(--ink-2); font-family: var(--display); white-space: nowrap;
  font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--turf); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stack { display: grid; gap: 14px; margin-top: 16px; }
.stack.flush { margin-top: 0; }
.stack > *, .card { min-width: 0; }
.card > h2 + * { margin-top: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px;
  font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 18px; }
.chip.good { background: var(--good-bg); color: var(--good); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.turf { background: var(--turf-soft); color: var(--turf); }
.chip.info { background: var(--info-bg); color: var(--series-1); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.grade { display: inline-block; min-width: 20px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 14px; border-radius: 5px; padding: 0 5px; }
.grade.A, .grade.B { background: var(--good-bg); color: var(--good); } .grade.C { background: var(--surface-2); color: var(--ink-2); }
.grade.D, .grade.F { background: var(--bad-bg); color: var(--bad); }
.sm-only { display: none; }
.pos-sm { display: none; font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.pos { display: inline-block; min-width: 30px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .03em; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px;
  font-weight: 600; cursor: pointer; color: var(--ink-2); text-decoration: none; display: inline-flex; gap: 6px; align-items: baseline; }
.pill.on { background: var(--turf-soft); border-color: var(--turf); color: var(--turf); }
a.pill:hover { border-color: var(--turf); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
.empty p { max-width: 60ch; margin-inline: auto; }
.banner { border-radius: 10px; padding: 10px 14px; background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--info-bg); color: var(--ink); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner a { font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 14px; cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--turf); color: var(--turf-ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select, .toolbar input[type=search] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
.toolbar label { display: inline-flex; gap: 5px; align-items: center; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.diff.up { color: var(--good); } .diff.down { color: var(--bad); }
a.plink { color: var(--ink); font-weight: 600; text-decoration: none; }
a.plink:hover { color: var(--turf); text-decoration: underline; }

/* summary */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { --tone: var(--line); --tone-ink: var(--ink); position: relative; overflow: hidden; border-radius: 12px; padding: 12px 14px 12px 17px;
  border: 1px solid color-mix(in srgb, var(--tone) 40%, var(--line)); background: color-mix(in srgb, var(--tone) 10%, var(--surface)); min-width: 0; }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--tone); }
.tile .label { font-size: 12.5px; font-weight: 600; color: var(--tone-ink); }
.tile .value { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.1; color: var(--tone-ink); }
.tile .value.sm { font-size: 21px; line-height: 1.25; }
.tile .value a { color: inherit; text-decoration: none; }
.tile .hint { font-size: 12.5px; color: var(--ink-2); }
.tile.t-turf { --tone: var(--turf); --tone-ink: var(--turf); }
.tile.t-good { --tone: var(--good); --tone-ink: var(--good); }
.tile.t-warn { --tone: var(--warn); --tone-ink: var(--warn); }
.tile.t-bad { --tone: var(--bad); --tone-ink: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.checklist li:last-child { border-bottom: 0; }
.checklist .tag { flex: 0 0 62px; }
details.warn-list summary { cursor: pointer; font-weight: 600; }
details.warn-list li { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

/* why panel */
.why { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0 4px; }
.why .step, .term { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; text-align: center; }
.why .step .k, .term .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.why .step .v, .term .v { font-weight: 700; }
.why .step.up .v, .term.up .v { color: var(--good); } .why .step.down .v, .term.down .v { color: var(--bad); }
.why .step.result { border-color: var(--turf); background: var(--turf-soft); }
.op { color: var(--muted); }
.why-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); padding-top: 6px; }

/* search */
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-height: 340px; overflow-y: auto; }
.results button { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; padding: 8px 12px; border: 0;
  background: none; text-align: left; cursor: pointer; }
.results button:hover, .results button.hl { background: var(--surface-2); }

/* player */
.phead { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.pname { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.05; text-transform: uppercase; }
.pos-team { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink-2); letter-spacing: .04em; }
.projbox { text-align: right; }
.projbox .num { font-family: var(--display); font-size: 48px; font-weight: 800; line-height: 1; color: var(--turf); }
.projbox .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.formula { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.stats3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { border-left: 3px solid var(--turf); padding-left: 10px; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.stat .v { font-family: var(--display); font-size: 24px; font-weight: 700; }
.model { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--turf-soft); font-size: 14px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }

/* chart + tables */
.chart { position: relative; margin-top: 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.sw.line { height: 3px; border-radius: 2px; vertical-align: 3px; }
.sw.outline { background: transparent; border: 2px dashed var(--turf); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line); min-width: 140px;
  border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: var(--shadow); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; font-weight: 600;
  padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.num, th.num { text-align: right; }
td.best { color: var(--turf); font-weight: 700; }
td.adj { font-weight: 700; font-size: 15.5px; text-align: right; }
tfoot td { border-bottom: 0; font-weight: 700; }
th.sortable { cursor: pointer; user-select: none; } th.sorted { color: var(--ink); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td, tr.expanded td { background: var(--surface-2); }
tr.expanded td { border-bottom-color: transparent; }
tr.detail td { background: var(--surface-2); padding: 2px 10px 14px; white-space: normal; }
tr.flag-start td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.flag-bench td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.cmp th.pl { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
.cmp th.pl, .cmp td { white-space: normal; min-width: 110px; }
.cmp tbody th { white-space: normal; min-width: 120px; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 15px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 13px; }
.whatif { font-size: 13px; }

/* matchup */
.scoreboard { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.sb-team.right { text-align: right; }
.sb-name { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; overflow-wrap: anywhere; }
.sb-pts { font-family: var(--display); font-size: 44px; font-weight: 800; line-height: 1; }
.sb-mid { text-align: center; min-width: 110px; }
.sb-wp { font-family: var(--display); font-size: 26px; font-weight: 800; }
.wpbar { height: 6px; border-radius: 3px; background: var(--series-2); overflow: hidden; margin-top: 4px; }
.wpbar span { display: block; height: 100%; background: var(--series-1); }
.mtable td { white-space: normal; }
.m-slot { text-align: center; color: var(--muted); font-size: 11.5px; font-weight: 700; width: 46px; }
.m-pts { text-align: right; white-space: nowrap; width: 64px; }
.m-pts.r { text-align: left; }
.m-player.r { text-align: right; }
.chip.live { background: var(--bad-bg); color: var(--bad); }
details.card > summary { cursor: pointer; font-weight: 700; }

/* news */
.sbar { display: inline-flex; align-items: center; gap: 6px; }
.sbar .track { position: relative; width: 70px; height: 6px; background: var(--surface-2); border-radius: 3px; }
.sbar .track::after { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: var(--muted); }
.sbar .fill { position: absolute; top: 0; height: 6px; border-radius: 3px; }
.sbar .fill.up { background: var(--good); } .sbar .fill.down { background: var(--bad); }
.sbar .val { font-size: 13px; min-width: 38px; }
.articles { list-style: none; margin: 4px 0 0; padding: 0; }
.articles li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; white-space: normal; }
.articles .src { color: var(--muted); font-size: 12.5px; }

/* chat */
.chat { display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 12px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--turf); color: var(--turf-ink); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul { margin: 4px 0 8px; padding-left: 18px; }
.msg .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.composer { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: vertical; min-height: 44px; max-height: 160px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
  .pos-sm { display: inline; }
  .sm-only { display: block; }
  .detail-in { width: calc(100vw - 92px); }
  table.wrap1 td.nm { white-space: normal; min-width: 130px; width: 100%; }
  .pname { font-size: 28px; } .projbox .num { font-size: 40px; }
  .stats3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .projbox { text-align: left; }
  nav.tabs a { font-size: 15px; padding-inline: 9px; }
  .sb-pts { font-size: 32px; }
  .mtable { table-layout: fixed; }
  .mtable td { padding: 6px 3px; }
  .mtable .m-slot { width: 34px; font-size: 10.5px; }
  .mtable .m-pts { width: 50px; }
  .mtable .m-player > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtable .small { font-size: 11px; }
  .mtable .chip { font-size: 10.5px; padding: 0 5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brand-l"><h1>Brendobendo <span>Scout</span></h1><span class="fresh" id="fresh">Loading…</span><span class="chip warn" id="stale" hidden>Stale</span></div>
      <select id="run-picker" aria-label="Choose which pipeline run to view" hidden></select>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#summary" data-t="summary">Summary</a>
      <a href="#roster" data-t="roster">Roster</a>
      <a href="#matchup" data-t="matchup">Matchup</a>
      <a href="#player" data-t="player">Player</a>
      <a href="#waivers" data-t="waivers">Waivers</a>
      <a href="#news" data-t="news">News</a>
      <a href="#compare" data-t="compare">Compare</a>
      <a href="#ask" data-t="ask">Ask</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"><div class="card empty" style="margin-top:16px">Loading…</div></main>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (v) => (v == null || Number.isNaN(v) ? "–" : Number(v).toFixed(1));
const sgn = (v, d = 1) => (v == null ? "–" : (Math.round(v * 10 ** d) > 0 ? "+" : Math.round(v * 10 ** d) < 0 ? "−" : "") + Math.abs(v).toFixed(d));
const dcls = (v) => (v == null ? "" : Math.round(v * 10) > 0 ? "up" : Math.round(v * 10) < 0 ? "down" : "");
const store = { get(k, d) { try { const v = localStorage.getItem("scout:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem("scout:" + k, JSON.stringify(v)); } catch { /* storage off */ } } };
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 172800) return `${Math.round(s / 3600)}h ago`;

const MULTS = [["mult_injury", "injury"], ["mult_matchup", "matchup"], ["mult_weather", "weather"], ["mult_sentiment", "news"]];
const multChips = (e) => `<span class="chips">${MULTS.filter(([k]) => e[k] !== undefined && Math.abs(e[k] - 1) > 0.0005)

function compareCard() {

// your lineup as Sleeper had it at export time, so START/BENCH flags match the Matchup tab
function lineupDiff(s) {

// ---- search index (league players, waiver pool, nflverse players) ------------------------------
const proj = (p) => (p.proj && p.proj.value != null ? p.proj.value : null);

function buildIndex() {

  if (LG) {
    for (const [pid, d] of Object.entries(LG.players || {})) add(pid, d.name, d.position, d.team, d.owner, d.eval ? d.eval.adj : null);
    for (const r of (LG.waivers && LG.waivers.pool && LG.waivers.pool.players) || []) add(r.player_id, r.name, r.position, r.team, null, r.adj);
  }
  for (const p of D.players) {
    const pid = sid2pid.get(p.id);
    if (pid && idx.has(pid)) { idx.get(pid).aka = p.aka; continue; }
    add(p.id, p.name, p.pos, p.team, p.mine ? "Mine" : undefined, proj(p), p.aka);

}
function searchIndex(q, limit = 10) {
  const s = String(q || "").toLowerCase().trim();
  if (!s) return [];

  for (const p of INDEX) {
    const n = p.name.toLowerCase();
    const hay = `${n} ${p.team} ${p.pos} ${p.aka || (p.pos === "DEF" ? "dst d/st defense" : "")}`.toLowerCase();
    if (!s.split(/\s+/).every((t) => hay.includes(t))) continue;
    const prefix = n.startsWith(s) || n.split(" ").some((w) => w.startsWith(s)) || (p.aka || "").toLowerCase().startsWith(s);
    out.push([p.pos === "DEF" && s === String(p.team).toLowerCase() ? -1 : prefix ? 0 : 1, -(p.val || 0), p]);
  }
  return out.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, limit).map((x) => x[2]);
}
function searchBox(placeholder, onPick, id) {
  const w = document.createElement("div");
  w.className = "search";
  w.innerHTML = `<input id="${id}" type="search" placeholder="${esc(placeholder)}" autocomplete="off" aria-label="${esc(placeholder)}"><div class="results" hidden></div>`;
  const inp = $("input", w), box = $(".results", w);
  let items = [], hl = 0;
  const paint = () => {
    box.hidden = !items.length;
    box.innerHTML = items.map((p, i) => `<button type="button" data-i="${i}" class="${i === hl ? "hl" : ""}">
      <span><b>${esc(p.name)}</b> <span class="muted small">${esc(p.pos)} · ${esc(p.team)}</span></span>${ownerChip(p.owner)}</button>`).join("");
  };
  const pick = (p) => { onPick(p); inp.value = ""; items = []; paint(); };
  inp.addEventListener("input", () => { items = searchIndex(inp.value); hl = 0; paint(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { hl = Math.min(hl + 1, items.length - 1); paint(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); paint(); e.preventDefault(); }
    else if (e.key === "Enter" && items[hl]) pick(items[hl]);

  });
  box.addEventListener("mousedown", (e) => { const b = e.target.closest("button[data-i]"); if (b) { e.preventDefault(); pick(items[+b.dataset.i]); } });
  inp.addEventListener("blur", () => setTimeout(() => { items = []; paint(); }, 150));

}

// ---- charts ---------------------------------------------------------------------------------------
function niceMax(v) { const step = v <= 10 ? 2 : v <= 25 ? 5 : 10; return Math.max(step * 2, Math.ceil(v / step) * step); }
const roundBar = (cx, top, base, bw, fill) => {
  const r = Math.min(4, (base - top) / 2), x0 = cx - bw / 2, x1 = cx + bw / 2;
  return base - top < 0.5 ? "" : `<path fill="${fill}" d="M${x0},${base} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x1 - r} Q${x1},${top} ${x1},${top + r} V${base} Z"/>`;
};
function axes(svgW, H, Lm, Rm, T, B, max) {

    <text x="${Lm - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${+t.toFixed(1)}</text>`).join("");
}
// League history: bars = actual, line = Sleeper projection, dashed bar = this week's projection
function historyChart(h) {
  const Wd = 720, H = 240, Lm = 34, Rm = 10, T = 12, B = 28;
  const max = niceMax(Math.max(5, ...h.flatMap((d) => [d.actual, d.projected]).filter((v) => v != null)));
  const band = (Wd - Lm - Rm) / h.length, bw = Math.min(28, band * 0.55);
  const x = (i) => Lm + band * i + band / 2, y = (v) => T + (H - T - B) * (1 - Math.max(0, v) / max), base = y(0);
  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Weekly fantasy points, actual vs projected">${axes(Wd, H, Lm, Rm, T, B, max)}`;
  h.forEach((d, i) => {
    if (d.current && d.actual == null && d.projected != null) {
      const top = y(d.projected);
      svg += `<rect x="${x(i) - bw / 2}" y="${top}" width="${bw}" height="${Math.max(0, base - top)}" rx="3" fill="none" stroke="var(--turf)" stroke-width="2" stroke-dasharray="5 3"/>`;
    } else if (d.actual != null) svg += roundBar(x(i), y(d.actual), base, bw, "var(--series-1)");

  });
  const pts = h.map((d, i) => (d.projected != null && !d.bye ? [x(i), y(d.projected)] : null));
  let path = "", pen = false;
  pts.forEach((p) => { if (p) { path += (pen ? "L" : "M") + p[0] + "," + p[1]; pen = true; } else pen = false; });
  svg += `<path d="${path}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p) => { if (p) svg += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"/>`; });
  h.forEach((d, i) => { svg += `<rect class="hit" data-i="${i}" x="${Lm + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>`; });
  svg += `<line x1="${Lm}" x2="${Wd - Rm}" y1="${base}" y2="${base}" stroke="var(--ink-2)" stroke-opacity=".4"/></svg>`;

    <span><span class="sw line" style="background:var(--series-2)"></span>Sleeper projection</span>

function tipAt(ev, html) {

// nflverse weekly points: one series draws bars, several draw lines
function weeklyChart(series, { projection = null } = {}) {

  const lastW = Math.max(D.meta.through_week, projection ? projection.week : 0, 1);

}

  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });
  $("#stop").addEventListener("click", () => ctl?.abort());
  $("#composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || ctl) return;
    input.value = "";
    S.turns.push({ role: "user", content: q });
    paint();
    const bubble = document.createElement("div");
    bubble.className = "msg bot";
    bubble.innerHTML = `<span class="muted">Thinking…</span>`;
    chat.append(bubble);
    $("#send").disabled = true; $("#stop").hidden = false;
    ctl = new AbortController();
    const looked = [];
    const tools = TOOLS.map((t) => ({ ...t, execute: (inp, c) => { looked.push(t.name === "get_player" ? String(inp.player) : t.name.replace(/_/g, " ")); bubble.innerHTML = `<span class="muted">Looking up ${esc(looked.slice(-3).join(", "))}…</span>`; return t.execute(inp, c); } }));
    try {
      const { text, truncated } = await sample([{ role: "user", content: rules() }, ...S.turns.slice(-12)], {
        tools, signal: ctl.signal, onText: ({ text }) => { bubble.innerHTML = md(text); chat.lastElementChild?.scrollIntoView({ block: "nearest" }); } });
      S.turns.push({ role: "assistant", content: text + (truncated ? "\n\n(Answer cut short.)" : "") });
      store.set("turns", S.turns.slice(-30));
      paint();
    } catch (err) {
      if (err.code !== "cancelled") bubble.innerHTML = (err.text ? md(err.text) : "") + `<div class="meta">${esc(ERR[err.code] || "Something went wrong reaching Claude. Try again.")}</div>`;
      else bubble.innerHTML = err.text ? md(err.text) : `<span class="muted">Stopped.</span>`;
      if (err.text) { S.turns.push({ role: "assistant", content: err.text }); store.set("turns", S.turns.slice(-30)); }
    } finally {
      ctl = null; $("#send") && ($("#send").disabled = false); $("#stop") && ($("#stop").hidden = true);
    }
  });
}
async function verdict(ps) {
  const out = $("#verdict-out"), btn = $("#ask-verdict");
  const sample = await getSample();
  if (!sample) { out.textContent = "Claude isn't available in this view."; return; }
  btn.disabled = true; out.className = "small"; out.innerHTML = `<span class="muted">Thinking…</span>`;
  const prompt = `${rules()}\n\nCompare these players for this week and say who to start (rank them if more than two). Lead with the call, then 2-3 bullets of reasons with numbers, and one line on risk.\n\n${JSON.stringify(ps.map(detail))}`;
  try { await sample(prompt, { onText: ({ text }) => { out.innerHTML = md(text); }, cache: { gcTime: 30 * 60 * 1000 } }); }
  catch (err) { out.innerHTML = (err.text ? md(err.text) : "") + `<div class="muted">${esc(ERR[err.code] || "Couldn't reach Claude. Try again.")}</div>`; }
  finally { btn.disabled = false; }
}

// ---- shell -----------------------------------------------------------------------------------
const TABS = ["summary", "roster", "matchup", "player", "waivers", "news", "compare", "ask"];
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1)), i = h.indexOf(".");
  const tab = i < 0 ? h : h.slice(0, i), arg = i < 0 ? null : h.slice(i + 1);
  return { tab: TABS.includes(tab) ? tab : LG && LG.summary ? "summary" : "player", arg };
}
function route() {
  const { tab, arg } = parseHash();
  document.querySelectorAll("#tabs a").forEach((a) => (a.dataset.t === tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  $("#tip").hidden = true;
  if (tab !== "ask") ctl?.abort();
  const html = { summary: pageSummary, roster: pageRoster, matchup: pageMatchup };
  if (html[tab]) view.innerHTML = html[tab]();
  else ({ player: () => pagePlayer(arg), waivers: pageWaivers, news: pageNews, compare: pageCompare, ask: pageAsk })[tab]();
  if (tab !== "player" || !arg) store.set("tab", tab);
  if (!arg) window.scrollTo(0, 0);
}
document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-action=latest]");
  if (a) { ev.preventDefault(); S.run = null; renderHeader(); route(); }
});
$("#run-picker").addEventListener("change", (ev) => {
  S.run = ev.target.value || null;
  renderHeader();
  const t = parseHash().tab;
  if (!["summary", "roster", "matchup", "waivers", "news"].includes(t)) location.hash = "summary"; else route();
});
bindExpand(view);

(async function init() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`data.json returned ${r.status}`);
    D = await r.json();
  } catch (e) {
    $("#fresh").textContent = "";
    view.innerHTML = `<div class="card empty" style="margin-top:16px"><h2>Player data didn't load</h2><p>${esc(e.message)}. Republish Scout with its data file.</p></div>`;
    return;
  }
  D.players.forEach((p) => byId.set(p.id, p));
  try {
    const r = await fetch("league.json", { cache: "no-store" });
    if (r.ok) LG = await r.json();
  } catch { /* published without league data: player tools still work */ }
  if (LG) {
    LG.players = LG.players || {}; LG.scout_ids = LG.scout_ids || {};
    for (const [pid, sid] of Object.entries(LG.scout_ids)) if (!sid2pid.has(sid)) sid2pid.set(sid, pid);
    for (const r of (LG.waivers && LG.waivers.pool && LG.waivers.pool.players) || []) poolById.set(r.player_id, r);
    if (LG.waivers) LG.waivers.whatif = LG.waivers.whatif || {};
    if (LG.roster) {   // your live Sleeper roster decides "mine", not the last pipeline run
      const mine = new Set((LG.roster.players || []).map((pid) => LG.scout_ids[pid]).filter(Boolean));
      D.players.forEach((p) => { if (mine.has(p.id)) p.mine = true; else delete p.mine; });
    }
  }
  buildIndex();
  renderHeader();
  const saved = store.get("tab", null);
  if (!location.hash && saved && TABS.includes(saved) && saved !== parseHash().tab) { location.hash = saved; return; }
  route();
})();
window.addEventListener("hashchange", route);
</script>
