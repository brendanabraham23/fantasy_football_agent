# Pushes the web app to a Hugging Face Space (Docker SDK) whenever the app code changes.
# Repository secret HF_TOKEN (write token) and variable HF_SPACE (e.g. yourname/fantasy-analyzer).
name: deploy-space

on:
  push:
    branches: [main, agent_v2]
    paths: ["ffa/**", "config.json", "requirements.txt", "Dockerfile", ".dockerignore",
            ".github/workflows/deploy-space.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the Space
        run: |
          mkdir space
          cp -r ffa config.json requirements.txt Dockerfile .dockerignore space/
          find space -name __pycache__ -prune -exec rm -rf {} +
          cat > space/README.md <<'EOF'
          ---
          title: Fantasy Analyzer
          emoji: 🏈
          colorFrom: green
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          Deployed from GitHub by the deploy-space workflow; edit the source repo, not this Space.
          EOF

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
