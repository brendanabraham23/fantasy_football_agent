# Runs the weekly pipeline and/or refreshes the data exports, and commits reports/ to the `data` branch.
# Readers: the hosted UI (reports/), and Scout (reports/scout/data.json + reports/league.json).
# Timing lives in claude.ai scheduled tasks, which start this workflow through workflow_dispatch because GitHub's own
# cron runs hours late or not at all on this repo (see CLAUDE.md, "Schedule"). The one cron below is only a daily
# export-only backup in case those tasks stop.
# Repository variables: SLEEPER_USERNAME (required), SLEEPER_LEAGUE_ID (optional).
name: predict

on:
  schedule:
    - cron: "0 10 * * *"    # backup: export only, ~6 a.m. ET
  workflow_dispatch:
    inputs:
      pipeline:
        description: Run the full pipeline (off = only refresh the exports)
        type: boolean
        default: true
      news:
        description: News & sentiment
        type: boolean
        default: true
      weather:
        description: Weather
        type: boolean
        default: true
      week:
        description: NFL week (blank = Sleeper's current week, which only rolls over on Wednesday)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ffa
          key: ffa-http-${{ github.run_id }}
          restore-keys: ffa-http-

      - name: Check out the data branch
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$URL" data >/dev/null; then
            git clone -q --depth 1 --branch data "$URL" data
          else
            mkdir data && git -C data init -q -b data && git -C data remote add origin "$URL"
            printf '# Generated reports\n\nWritten by the predict workflow; read by the hosted UI. Do not edit.\n' > data/README.md
          fi

      - name: Run pipeline
        if: env.FULL == 'true'
        env:
          SLEEPER_USERNAME: ${{ vars.SLEEPER_USERNAME }}
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
          NEWS: ${{ github.event_name != 'workflow_dispatch' || inputs.news }}
          WEATHER: ${{ github.event_name != 'workflow_dispatch' || inputs.weather }}
          WEEK: ${{ inputs.week }}
        run: |
          test -n "$SLEEPER_USERNAME" || { echo "::error::Set the SLEEPER_USERNAME repository variable"; exit 1; }
          args=(--username "$SLEEPER_USERNAME" --out data/reports)
          [ -n "$SLEEPER_LEAGUE_ID" ] && args+=(--league-id "$SLEEPER_LEAGUE_ID")
          [ -n "$WEEK" ] && args+=(--week "$WEEK")
          [ "$NEWS" = "true" ] || args+=(--no-news)
          [ "$WEATHER" = "true" ] || args+=(--no-weather)
          python -m ffa "${args[@]}"

      - name: Export for Scout
        env:
          SLEEPER_USERNAME: ${{ vars.SLEEPER_USERNAME }}
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
          WEEK: ${{ inputs.week }}
        run: |
          test -n "$SLEEPER_USERNAME" || { echo "::error::Set the SLEEPER_USERNAME repository variable"; exit 1; }
          league=(); [ -n "$SLEEPER_LEAGUE_ID" ] && league=(--league-id "$SLEEPER_LEAGUE_ID")
          [ -n "$WEEK" ] && league+=(--week "$WEEK")
          python -m ffa scout-data --reports data/reports --out data/reports/scout/data.json \
            || echo "::warning::scout-data failed; keeping the previous data.json"
          python -m ffa export --username "$SLEEPER_USERNAME" "${league[@]}" --reports data/reports \
            --out data/reports/league.json

      - name: Commit to the data branch
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "$([ "$FULL" = true ] && echo Pipeline run || echo Export) $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"
          git push -q origin HEAD:data
